# Token prices for the cost table, in US dollars per million tokens. Columns are explained in
# docs/specs/analysis/tables.md#cost. One row per llm row in configs/models/poc.toml. Add the full
# study's rows once their ids are verified, see TODO.md.
#
# Read from each provider's own pricing page on the date below:
# - https://platform.claude.com/docs/en/about-claude/pricing
# - https://aistudio.google.com/docs/pricing, the paid tier at standard speed
read_on = 2026-11-11

# Haiku 5.5 has two rate cards. These are for a prompt of up to 100,000 tokens, which every run is.
# A longer prompt pays five times as much. cache_write is the 5 minute rate, which inspect asks for
# unless a sample waits over five minutes between calls. The 1 hour rate is 0.20.
[[price]]
id = "anthropic/claude-haiku-5-5"
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

# cache_write is the 5 minute rate, as above. The 1 hour rate is 4.00.
[[price]]
id = "anthropic/claude-sonnet-5-5"
input = 2.00
output = 10.00
cache_read = 0.10
cache_write = 2.50

# Output includes thinking tokens. Google caches a repeated start on its own and charges nothing
# to write it, so there is no cache_write and the table prices any as input.
[[price]]
id = "google/gemini-3.5-flash-lite"
input = 0.30
output = 2.50
cache_read = 0.03
