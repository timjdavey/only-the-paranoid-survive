# Proof of concept model list. Columns are explained in docs/harness/models.md.
# Verify every third-party id against its provider before the first run.
# No baseline rows: every sample's score already holds all six baselines' outputs, see docs/specs/harness/scorer.md.

[[model]]
id = "anthropic/claude-haiku-5-5"
kind = "llm"
reasoning = "off"
notes = "Cheapest Claude. Off since the off check passed on 2026-11-12: no reasoning token in two 12 round runs. With thinking off it works in the compute tool on most rounds instead"

[[model]]
id = "anthropic/claude-sonnet-5-5"
kind = "llm"
reasoning = "low"
notes = "The mid Claude. It stays at low, as it failed the off check on 2026-11-12: at off it still thought, about 50 reasoning tokens a round, the same as at low. It also refuses a forced tool call, so inspect sends auto. It reads its own earlier thinking when the blocks are sent back as they came, which inspect does"

[[model]]
id = "google/gemini-3.5-flash-lite"
kind = "llm"
reasoning = "low"
pilot = false
notes = "Cheap non-Claude, and the model Google sends gemini-2.5-flash traffic to from 2026-12-01. Google's docs list the thinking levels minimal, low, medium and high and no off, so low is the lowest the grid can send. The off check with a key may still move it to off, see TODO.md. Its thought signatures carry its reasoning to a later turn when sent back, which inspect does. Out of the pilot since 2026-11-12, so no pilot cell plays it, see docs/harness/models.md#columns"

[[model]]
id = "jev/jev-latest"
kind = "jev"
reasoning = "n/a"
notes = "See docs/harness/providers.md"

# Jev-compatible decision models from Decision Models, played through its EU tier. Pinned ids, as the
# s1-pro and s1-fast aliases can change model. Limits read from https://decisionmodels.io/llms.txt on 2026-11-12.
# Left out: s1-vision-2 gives s1-fast-2's answers exactly, s1-pro-2 and reax-1.2 retire in December, and
# s1-llm-auto-router is a fixed-schema routing classifier, not a decision model.

[[model]]
id = "jev/decisionmodels/s1-pro-5"
kind = "jev"
reasoning = "n/a"
notes = "mammoth-1 27B by baselabs, a Qwen3.5-27B fine-tune. The top open-weights row on JevBench. EU tier only, 8,192 input tokens"

[[model]]
id = "jev/decisionmodels/s1-pro-3"
kind = "jev"
reasoning = "n/a"
notes = "vLLM-SR d3 26B, a Qwen3.8-27B fine-tune. 16,384 input tokens. Kept until at least 2027-01-27"

[[model]]
id = "jev/decisionmodels/s1-fast-2"
kind = "jev"
reasoning = "n/a"
notes = "Blink v0.3 26B-A4B, a Gemma 4 mixture of experts. The small, cheap point. 16,192 input tokens. Runs batched, so one request twice can differ slightly"

[[model]]
id = "jev/decisionmodels/reax-1-20261021"
kind = "jev"
reasoning = "n/a"
notes = "REAX 1, Decision Models' own fine-tune of Perplexity Decider v1.2, from Qwen3.8-27B. 8,192 input tokens"

[[model]]
id = "jev/decisionmodels/reax-1.3"
kind = "jev"
reasoning = "n/a"
notes = "REAX 1.3, two fine-tunes from the REAX training network answering together. EU tier only. 28,672 input tokens, and each prompt counts twice"

