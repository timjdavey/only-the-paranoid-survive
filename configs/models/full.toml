# Full study model list. Fill in when budget lands. Columns are explained in docs/harness/models.md.
# Every non-LLM row in poc.toml (Jev, Decision Models, Timestral) runs here too. Every LLM the full study sweeps is listed below.
# released and eci come from Epoch AI's https://epoch.ai/data/eci_scores.csv (CC BY 4.0), read on 2026-11-09.
# Each reasoning value is its own result row. Values marked "to verify" in notes need checking against the provider before the first run.
#
# Left out on purpose:
# - Claude Fable 5.1. Its ECI sits below Opus 5.5, and Claude already has four rows
# - Claude Sonnet 4.5. Retires 2026-11-30
# - gpt-5. Shuts down 2026-12-11. gpt-5.1 is the GPT-5 era point instead
# - Gemini 2.5 Pro and Flash. Silently rerouted to newer models on 2026-12-01
# - Kimi K3.1 Pro. No ECI score yet
# - Meta Muse. Not on OpenRouter

# Anthropic

[[model]]
id = "anthropic/claude-haiku-4-5-20251001"
kind = "llm"
released = 2025-10-15
