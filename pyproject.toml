[project]
name = "paranoid"
version = "0.1.0"
description = "A benchmark for how well an agent tells a shock that passes from one that creates a new normal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # One minor version only: a timeline is bit-equal within one numpy version,
    # see docs/specs/engine/config.md#engine-hash.
    "numpy~=2.5.0",
    # The version every "Checked" section in docs/specs/harness/ was run on.
    "inspect_ai==0.3.289",
    "pydantic>=2",
    "python-dotenv>=1",
    # Jev's SDK. Imported lazily, inside paranoid.harness.providers.jev only.
    "typesafe-sdk~=0.7.5",
    # The provider SDKs inspect calls a model through. inspect ships none of them and raises on the first
    # call without one, see docs/harness/running.md#setup. The floors are inspect 0.3.289's own.
    "anthropic>=2.0.0",
    "google-genai>=3.0.0",
    "openai>=3.4.0",  # OpenAI and OpenRouter rows, which only the full study has
    # The analysis layer's three. matplotlib is exact, as its version is written into every SVG,
    # see docs/specs/analysis/plots.md#checked.
    "pandas~=3.1.0",
    "matplotlib==3.11.2",
    "scipy~=1.18.1",
]

[project.scripts]
paranoid = "paranoid.harness.cli:main"

# Registers the @task and the baseline, jev and timestral providers, see docs/specs/harness/providers.md#registration.
[project.entry-points.inspect_ai]
paranoid = "paranoid.harness"

# Subcommands from layers above the harness, which `paranoid` loads only when named,
# see docs/specs/harness/command.md#subcommands.
[project.entry-points."paranoid.commands"]
analyse = "paranoid.analysis.cli:analyse"

[project.optional-dependencies]
# torch and Timestral, which only paranoid.forecasters imports. Pinned to one commit as a direct
# reference, so no installer ever resolves the name from an index, see docs/specs/forecasters/timestral.md#pinned.
timestral = [
    "torch>=2.4",
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "hypothesis>=6.170",
    "import-linter>=2.16",
    "pytest-xdist>=3.8.0",
    # The analysis suite builds its fixture logs once across workers, see docs/specs/analysis/tests.md.
    "filelock>=3.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the timestral extra's git pin

[tool.hatch.build.targets.wheel]
packages = ["src/paranoid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests, sweeps, tests on the real Timestral and tests that need Docker are skipped by default.
# Run them with `uv run pytest -m slow`, `-m sweep`, `-m timestral` or `-m sandbox`.
# Tests run on one worker per core. Add `-n 0` to run them in one process. Idle workers take
# tests from busy ones (`--dist worksteal`), as the slow tests sit together in a few files.
addopts = "-m 'not slow and not sweep and not timestral and not sandbox' --strict-markers --import-mode=importlib -n auto --dist worksteal"
markers = [
    "slow: runs a thousand seeds or more, or takes minutes, see the tests page of each layer's spec. Run by hand, CI skips them",
    "sweep: plays a thousand seeds of a baseline, see docs/specs/baselines/tests.md. Run by hand, CI skips them",
    "timestral: loads the real Timestral, so it needs the timestral extra, see docs/specs/forecasters/tests.md. Run by hand, CI skips them",
    "sandbox: runs the compute tool in Docker, see docs/specs/harness/tests.md. Run by hand, CI skips them",
]

# The layer rule, see docs/harness/layout.md#six-layers. CI runs `lint-imports`.
[tool.importlinter]
root_package = "paranoid"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "A layer imports only from the layers below it"
type = "layers"
layers = [
    "paranoid.analysis",
    "paranoid.harness",
    "paranoid.skins | paranoid.forecasters",  # side by side, neither imports the other
    "paranoid.baselines",
    "paranoid.engine",
]

[[tool.importlinter.contracts]]
name = "The engine's and the baselines' only third-party import is numpy"
type = "forbidden"
source_modules = ["paranoid.engine", "paranoid.baselines"]
forbidden_modules = ["inspect_ai", "pandas", "matplotlib", "scipy", "torch", "hypothesis", "pytest"]

[[tool.importlinter.contracts]]
name = "Only the forecasters layer imports torch or Timestral"
type = "forbidden"
source_modules = ["paranoid.engine", "paranoid.baselines", "paranoid.skins", "paranoid.harness", "paranoid.analysis"]
forbidden_modules = ["torch", "timestral", "huggingface_hub"]
# The harness imports paranoid.forecasters, whose lazy torch import would otherwise count against it.
# A direct import of torch from the harness still fails.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
# The layers contract would let skins import baselines and numpy. See docs/specs/skins/README.md#modules.
# Indirect imports are allowed, as the engine imports numpy itself.
name = "The skins layer imports only the engine and the standard library"
type = "forbidden"
source_modules = ["paranoid.skins"]
forbidden_modules = ["paranoid.baselines", "numpy", "inspect_ai", "pandas", "matplotlib", "scipy", "hypothesis", "pytest"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The harness and below import no pandas, matplotlib or scipy"
type = "forbidden"
source_modules = ["paranoid.engine", "paranoid.baselines", "paranoid.skins", "paranoid.forecasters", "paranoid.harness"]
forbidden_modules = ["pandas", "matplotlib", "scipy"]

[[tool.importlinter.contracts]]
# The layers contract would let the analysis import any layer below it. It reads scores, never plays.
# See docs/specs/analysis/README.md#names-from-the-harness.
name = "The analysis imports no baseline, skin or forecaster"
type = "forbidden"
source_modules = ["paranoid.analysis"]
forbidden_modules = ["paranoid.baselines", "paranoid.skins", "paranoid.forecasters"]
allow_indirect_imports = true
